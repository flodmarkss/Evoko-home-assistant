Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "AutoAddGPU" "false"
 Option "DontVTSwitch" "true"
EndSection
Section "Module"
 Disable "glx"
 Disable "glamoregl"
 Load "fbdevhw"
EndSection
Section "Device"
 Identifier "NasoFB"
 Driver "fbdev"
 Option "fbdev" "/dev/fb0"
 Option "ShadowFB" "false"
EndSection
Section "Monitor"
 Identifier "NasoLCD"
EndSection
Section "Screen"
 Identifier "NasoScreen"
 Device "NasoFB"
 Monitor "NasoLCD"
 DefaultDepth 16
 SubSection "Display"
  Depth 16
  Modes "1024x768"
 EndSubSection
EndSection
Section "InputDevice"
 Identifier "NasoTouch"
 Driver "evdev"
 Option "Device" "/dev/input/event0"
 Option "Calibration" "0 1023 0 767"
 Option "SwapAxes" "false"
EndSection
Section "ServerLayout"
 Identifier "NasoLayout"
 Screen "NasoScreen"
 InputDevice "NasoTouch" "CorePointer"
EndSection
